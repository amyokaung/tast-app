name: Android Build

on:
  push:
    branches:
      - main
      - fix/android-build

  pull_request:
    branches:
      - main

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # ─────────────────────────────────────
      # Node.js
      # ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ─────────────────────────────────────
      # Java
      # ─────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ─────────────────────────────────────
      # Android SDK
      # ─────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # ─────────────────────────────────────
      # Install Android SDK packages
      # ─────────────────────────────────────
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;27.1.12297006"

      # ─────────────────────────────────────
      # Verify Android SDK
      # ─────────────────────────────────────
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -d "$ANDROID_SDK_ROOT/cmake/3.31.6"
          test -d "$ANDROID_SDK_ROOT/ndk/27.1.12297006"

      # ─────────────────────────────────────
      # Gradle
      # ─────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # ─────────────────────────────────────
      # npm dependencies
      # ─────────────────────────────────────
      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          npm install

      # ─────────────────────────────────────
      # Clone llama.cpp
      # ─────────────────────────────────────
      - name: Clone llama.cpp
        shell: bash
        run: |
          set -e

          rm -rf cpp/llama.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            cpp/llama.cpp

      # ─────────────────────────────────────
      # Verify llama.cpp
      # ─────────────────────────────────────
      - name: Verify llama.cpp
        shell: bash
        run: |
          set -e

          test -f cpp/llama.cpp/CMakeLists.txt
          test -f cpp/llama.cpp/include/llama.h

          echo "llama.cpp verified successfully."

      # ─────────────────────────────────────
      # Build Release APK
      # ─────────────────────────────────────
      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          gradle assembleRelease --stacktrace --info

      # ─────────────────────────────────────
      # Verify Release APK
      # ─────────────────────────────────────
      - name: Verify Release APK
        shell: bash
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Signed Release APK was not generated."
            echo ""
            echo "Searching for generated APK files..."
            find android/app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "Signed Release APK generated successfully:"
          ls -lh "$APK_PATH"

      # ─────────────────────────────────────
      # Upload Release APK
      # ─────────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-offline-ai-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
